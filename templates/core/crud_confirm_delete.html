{% extends "base.html" %}
{% block title %}Dar de baja{% endblock %}

{% block content %}
<div class="card shadow-sm" style="max-width:36rem">
  <div class="card-body">
    <h1 class="h5">Dar de baja {{ crud_label|lower }}</h1>
    <p class="mb-4">
      ¿Confirmas la baja de <strong>{{ object }}</strong>?
      El registro se conserva para auditoría y deja de aparecer en los listados.
    </p>
    <form method="post">
      {% csrf_token %}
      <button class="btn btn-danger" type="submit">Confirmar baja</button>
      <a class="btn btn-link" href="{% url crud_slug|add:'_list' %}">Cancelar</a>
    </form>
  </div>
</div>
{% endblock %}
