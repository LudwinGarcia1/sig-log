{% extends "base.html" %}
{% block title %}Acceso{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm mt-5">
      <div class="card-header">Iniciar sesión</div>
      <div class="card-body">
        {% if form.errors %}
        <div class="alert alert-danger">
          Usuario o contraseña incorrectos.
        </div>
        {% endif %}
        <form method="post">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label" for="{{ form.username.id_for_label }}">Usuario</label>
            <input type="text" name="username" id="{{ form.username.id_for_label }}"
                   class="form-control" autofocus required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="{{ form.password.id_for_label }}">Contraseña</label>
            <input type="password" name="password" id="{{ form.password.id_for_label }}"
                   class="form-control" required>
          </div>
          <input type="hidden" name="next" value="{{ next }}">
          <button type="submit" class="btn btn-primary w-100">Entrar</button>
        </form>
      </div>
      <div class="card-footer text-body-secondary small">
        SIG-LOG — Sistema Integral de Gestión Logística
      </div>
    </div>
  </div>
</div>
{% endblock %}
